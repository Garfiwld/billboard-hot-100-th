name: update chart

on:
  schedule:
    - cron: "0 3 * * *"   # daily 03:00 UTC (10:00 Asia/Bangkok)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - run: npm run update
      - name: commit new weeks
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add week all.json latest.json
          git diff --cached --quiet || git commit -m "chart: update $(date -u +%Y-%m-%d)"
          git push
