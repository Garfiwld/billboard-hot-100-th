name: update chart

on:
  schedule:
    # 04:23 UTC = 11:23 น. ไทย
    # เป็นแค่ fallback — ตัวตั้งเวลาหลักคือ cron-job.org ที่ยิง workflow_dispatch
    - cron: "23 4 * * *"
  workflow_dispatch: {} # ให้กดรันเองได้ และให้ cron-job.org เรียกผ่าน API ได้

permissions:
  contents: write # ต้องมีสิทธิ์เขียน ไม่งั้น git push โดน 403

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      # ดึงโค้ด + เก็บ token ไว้ให้ git push ใช้
      - uses: actions/checkout@v4

      # ติดตั้ง Node 20 (ตรงกับ engine ที่ scraper ใช้: fetch built-in + ESM)
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # ติดตั้ง dependency (cheerio อย่างเดียว)
      - run: npm install

      # ดึงสัปดาห์ที่ยังไม่มี แล้ว rebuild all.json / latest.json — idempotent
      - run: npm run update

      # stage + commit + push เฉพาะเมื่อมีไฟล์เปลี่ยน
      - run: |
          git config user.name  "Garfiwld"
          git config user.email "garfiwld@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "Updated on $(date -u +%Y-%m-%d)"
          git push
