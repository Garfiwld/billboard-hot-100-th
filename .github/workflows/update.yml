name: update chart

on:
  schedule:
    # นาที 23 เพื่อเลี่ยงคิวแน่นตอนต้นชั่วโมง; ~03:23 UTC = ~10:23 น. ไทย
    # เป็นแค่ fallback — ตัวตั้งเวลาหลักคือ cron-job.org ที่ยิง workflow_dispatch
    - cron: "23 3 * * *"
  workflow_dispatch: {} # ให้กดรันเองได้ และให้ cron-job.org เรียกผ่าน API ได้

permissions:
  contents: write # ต้องมีสิทธิ์เขียน ไม่งั้น git push โดน 403

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      # ดึงโค้ด + เก็บ token ไว้ให้ git push ใช้ (checkout@v4 ตั้ง persist-credentials=true อยู่แล้ว)
      - uses: actions/checkout@v4

      # ติดตั้ง Node 20 (ตรงกับ engine ที่ scraper ใช้: fetch built-in + ESM)
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # ติดตั้ง dependency (cheerio อย่างเดียว)
      - run: npm install

      # ดึงสัปดาห์ที่ยังไม่มี แล้ว rebuild all.json / latest.json — idempotent
      - run: npm run update

      # หาวันที่ (UTC) ไว้ใส่ข้อความ commit
      - id: date
        run: echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      # commit เฉพาะเมื่อมีไฟล์เปลี่ยน — action จัดการเคส no-change + push ให้เอง
      # ไม่ตั้ง add: ใช้ default '.' (node_modules ติด .gitignore อยู่แล้ว)
      - uses: EndBug/add-and-commit@v9
        with:
          author_name: Update
          message: "Updated on ${{ steps.date.outputs.date }}"
